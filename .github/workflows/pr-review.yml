name: "🤖 PR Review Bot"

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "config/**"
      - "requirements.txt"

permissions:
  contents: read
  pull-requests: write

jobs:
  # ─────────────────────────────────────────────────────────
  # Job 1: Lint with flake8
  # ─────────────────────────────────────────────────────────
  lint:
    name: "🔍 Lint (flake8)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        id: flake8
        run: |
          mkdir -p reports
          flake8 src/ tests/ scripts/ \
            --format='%(path)s:%(row)d:%(col)d: %(code)s %(text)s' \
            --output-file=reports/flake8.txt \
            --tee || true
          # Count issues
          if [ -s reports/flake8.txt ]; then
            ISSUE_COUNT=$(wc -l < reports/flake8.txt | tr -d ' ')
            echo "issue_count=$ISSUE_COUNT" >> $GITHUB_OUTPUT
            echo "status=⚠️" >> $GITHUB_OUTPUT
          else
            echo "issue_count=0" >> $GITHUB_OUTPUT
            echo "status=✅" >> $GITHUB_OUTPUT
          fi

      - name: Upload lint report
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: reports/flake8.txt
          retention-days: 7

  # ─────────────────────────────────────────────────────────
  # Job 2: Type check with mypy
  # ─────────────────────────────────────────────────────────
  typecheck:
    name: "🔠 Type Check (mypy)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install mypy numpy scipy

      - name: Run mypy
        id: mypy
        run: |
          mkdir -p reports
          cd src
          mypy core/eskf.py core/eskf_sqrt.py fusion/ \
            --config-file ../mypy.ini \
            --no-error-summary 2>&1 | tee ../reports/mypy.txt || true
          cd ..
          if [ -s reports/mypy.txt ] && grep -q "error:" reports/mypy.txt; then
            ERROR_COUNT=$(grep -c "error:" reports/mypy.txt || echo "0")
            echo "error_count=$ERROR_COUNT" >> $GITHUB_OUTPUT
            echo "status=⚠️" >> $GITHUB_OUTPUT
          else
            echo "error_count=0" >> $GITHUB_OUTPUT
            echo "status=✅" >> $GITHUB_OUTPUT
          fi

      - name: Upload typecheck report
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-report
          path: reports/mypy.txt
          retention-days: 7

  # ─────────────────────────────────────────────────────────
  # Job 3: Run pytest suite
  # ─────────────────────────────────────────────────────────
  test:
    name: "🧪 Tests (pytest)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest-timeout

      - name: Run full test suite
        id: pytest
        run: |
          mkdir -p reports
          python -m pytest tests/ \
            -v \
            --timeout=120 \
            --tb=short \
            --junitxml=reports/pytest.xml \
            -m "not slow" \
            2>&1 | tee reports/pytest.txt || true

          # Parse results from JUnit XML
          if [ -f reports/pytest.xml ]; then
            TESTS=$(grep -oP 'tests="\K[0-9]+' reports/pytest.xml | head -1 || echo "0")
            FAILURES=$(grep -oP 'failures="\K[0-9]+' reports/pytest.xml | head -1 || echo "0")
            ERRORS=$(grep -oP 'errors="\K[0-9]+' reports/pytest.xml | head -1 || echo "0")
            SKIPPED=$(grep -oP 'skipped="\K[0-9]+' reports/pytest.xml | head -1 || echo "0")
            echo "tests=$TESTS" >> $GITHUB_OUTPUT
            echo "failures=$FAILURES" >> $GITHUB_OUTPUT
            echo "errors=$ERRORS" >> $GITHUB_OUTPUT
            echo "skipped=$SKIPPED" >> $GITHUB_OUTPUT
            if [ "$FAILURES" = "0" ] && [ "$ERRORS" = "0" ]; then
              echo "status=✅" >> $GITHUB_OUTPUT
            else
              echo "status=❌" >> $GITHUB_OUTPUT
            fi
          else
            echo "tests=0" >> $GITHUB_OUTPUT
            echo "failures=0" >> $GITHUB_OUTPUT
            echo "errors=0" >> $GITHUB_OUTPUT
            echo "skipped=0" >> $GITHUB_OUTPUT
            echo "status=❌" >> $GITHUB_OUTPUT
          fi

      - name: Run Jacobian validation tests
        id: jacobians
        run: |
          python -m pytest tests/test_jacobians.py \
            -v \
            --timeout=60 \
            --tb=long \
            2>&1 | tee reports/jacobians.txt || true

          if grep -q "FAILED" reports/jacobians.txt; then
            echo "status=❌" >> $GITHUB_OUTPUT
          elif grep -q "passed" reports/jacobians.txt; then
            echo "status=✅" >> $GITHUB_OUTPUT
          else
            echo "status=⚠️" >> $GITHUB_OUTPUT
          fi

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            reports/pytest.xml
            reports/pytest.txt
            reports/jacobians.txt
          retention-days: 7

  # ─────────────────────────────────────────────────────────
  # Job 4: Post structured review comment on the PR
  # ─────────────────────────────────────────────────────────
  review-comment:
    name: "💬 Post Review"
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: reports-all

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate review comment
        id: review
        run: |
          python scripts/pr_review_comment.py \
            --lint-report reports-all/lint-report/flake8.txt \
            --mypy-report reports-all/typecheck-report/mypy.txt \
            --pytest-report reports-all/test-reports/pytest.txt \
            --jacobian-report reports-all/test-reports/jacobians.txt \
            --output reports-all/review_comment.md

      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('reports-all/review_comment.md', 'utf8');

            // Find and update existing bot comment, or create new one
            const BOT_MARKER = '<!-- navcore-pr-review-bot -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(BOT_MARKER));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: BOT_MARKER + '\n' + body,
              });
              console.log(`Updated existing review comment #${existing.id}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: BOT_MARKER + '\n' + body,
              });
              console.log('Created new review comment');
            }

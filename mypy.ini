[mypy]
python_version = 3.9
warn_return_any = True
warn_unused_configs = True
warn_unused_ignores = True
check_untyped_defs = True

# Don't require full type annotations — gradual typing
disallow_untyped_defs = False
disallow_incomplete_defs = False

# Ignore missing stubs for scientific / hardware libraries
[mypy-pymavlink.*]
ignore_missing_imports = True

[mypy-open3d.*]
ignore_missing_imports = True

[mypy-scipy.*]
ignore_missing_imports = True

[mypy-sklearn.*]
ignore_missing_imports = True

[mypy-numpy.*]
ignore_missing_imports = True

[mypy-utils.*]
ignore_missing_imports = True
